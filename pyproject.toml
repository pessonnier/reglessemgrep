[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cast-semgrep-comparator"
version = "0.1.0"
description = "Local inventory and evidence-based comparison of CAST and Semgrep rules"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
]

[project.scripts]
comparator = "cast_semgrep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cast_semgrep"]

